<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оптимизация базовых станций | Инженерный калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <header class="content-header">
                <h1>Калькулятор <span class="accent">BS Placement</span></h1>
                <p>Инженерный калькулятор для расчётов</p>
                <button id="themeToggleBtn" class="theme-toggle-prominent">🎨 Сменить тему</button>
            </header>

            <div class="calculator-wrapper">
                <div class="screen-container">
                    <div id="result" class="calc-screen">0</div>
                </div>

                <div class="calc-buttons">
                    <div class="btn-row">
                        <button id="btn_op_sqrt" class="calc-btn secondary">√</button>
                        <button id="btn_op_square" class="calc-btn secondary">x²</button>
                        <button id="btn_op_backspace" class="calc-btn secondary">⌫</button>
                        <button id="btn_op_clear" class="calc-btn secondary">C</button>
                    </div>
                    <div class="btn-row">
                        <button id="btn_op_sign" class="calc-btn secondary">+/-</button>
                        <button id="btn_op_percent" class="calc-btn secondary">%</button>
                        <button id="btn_op_factorial" class="calc-btn secondary">x!</button>
                        <button id="btn_op_div" class="calc-btn primary">/</button>
                    </div>
                    <div class="btn-row">
                        <button id="btn_digit_7" class="calc-btn">7</button>
                        <button id="btn_digit_8" class="calc-btn">8</button>
                        <button id="btn_digit_9" class="calc-btn">9</button>
                        <button id="btn_op_mult" class="calc-btn primary">×</button>
                    </div>
                    <div class="btn-row">
                        <button id="btn_digit_4" class="calc-btn">4</button>
                        <button id="btn_digit_5" class="calc-btn">5</button>
                        <button id="btn_digit_6" class="calc-btn">6</button>
                        <button id="btn_op_minus" class="calc-btn primary">-</button>
                    </div>
                    <div class="btn-row">
                        <button id="btn_digit_1" class="calc-btn">1</button>
                        <button id="btn_digit_2" class="calc-btn">2</button>
                        <button id="btn_digit_3" class="calc-btn">3</button>
                        <button id="btn_op_plus" class="calc-btn primary">+</button>
                    </div>
                    <div class="btn-row">
                        <button id="btn_digit_0" class="calc-btn">0</button>
                        <button id="btn_digit_dot" class="calc-btn">.</button>
                        <button id="btn_op_equal" class="calc-btn primary execute">=</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
